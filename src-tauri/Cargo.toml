[package]
name = "social-manager"
version = "0.1.0"
description = "Yeaax Manager — central local-first de conteúdo para TikTok e Instagram"
authors = ["Arthur Scharfenberger"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# O sufixo `_lib` evita conflito de nome com o binário no Windows.
# Apenas `rlib`: o projeto é desktop-only (mobile exigiria staticlib/cdylib).
name = "social_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` permite exibir arquivos locais autorizados explicitamente (ver docs/SECURITY.md).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
reqwest = { version = "0.13", features = ["json"] }
keyring-core = "1"
# Login Kit Desktop do TikTok (DEC-027): CSPRNG do sistema, SHA-256 do PKCE e decodificação da query do callback.
getrandom = "0.3"
sha2 = "0.10"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1"
